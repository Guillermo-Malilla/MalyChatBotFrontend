<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Control - C.D. Malilla</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #1e5631; border-bottom: 2px solid #4c9a2a; padding-bottom: 10px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 100fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #4c9a2a; }
        .card.ia { border-left-color: #3b82f6; }
        .card.tokens { border-left-color: #f59e0b; }
        .card h3 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #777; }
        .card .valor { font-size: 28px; font-weight: bold; color: #222; }
        .seccion { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .seccion h2 { margin-top: 0; color: #1e5631; font-size: 20px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        li:last-child { border-bottom: none; }
        .badge { background-color: #eff6ff; color: #1e40af; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Eficiencia y Control de Costes</h1>
        <button id="btn-reiniciar" style="background-color: #dc2626; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 20px;">
            Reiniciar Historial de Consultas
        </button>
        
        <div class="grid-cards">
            <div class="card">
                <h3>Total Consultas</h3>
                <div class="valor" id="num-total-consultas">-</div>
            </div>
            <div class="card">
                <h3>Resueltas por BD</h3>
                <div class="valor" id="num-resueltas-bd">-</div>
            </div>
            <div class="card ia">
                <h3>Resueltas por IA</h3>
                <div class="valor" id="num-resueltas-ia">-</div>
            </div>
            <div class="card tokens">
                <h3>Tokens Consumidos</h3>
                <div class="valor" id="num-total-tokens">-</div>
            </div>
            <div class="card">
                <h3>Ahorro Eficiencia</h3>
                <div class="valor" id="txt-eficiencia">-</div>
            </div>
        </div>

        <div class="seccion">
            <h2>Preguntas recurrentes enviadas a la IA (Oportunidades de Optimización)</h2>
            <ul id="lista-preguntas-repetidas">
                <li>Cargando auditoría de datos...</li>
            </ul>
        </div>
    </div>

     <script src="config.js"></script>
    <script src="coordinadores.js"></script>
</body>
</html>
